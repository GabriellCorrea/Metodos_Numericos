<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Falsa Posição</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bela-page">

<div class="pagina">

    <a href="/" class="voltar">⬅ Voltar</a>

    <h1>Método da Falsa Posição</h1>

    <form method="POST">

        <input
            type="text"
            name="funcao"
            placeholder="Ex: x**3 - x - 2"
            required
        >

        <input
            type="number"
            step="any"
            name="a"
            placeholder="Valor de a"
            required
        >

        <input
            type="number"
            step="any"
            name="b"
            placeholder="Valor de b"
            required
        >

        <button type="submit">
            ✨ Calcular
        </button>

    </form>

    {% if resultado %}

    <div class="resultado">

        <h2>Raiz Encontrada</h2>

        <p>{{ resultado }}</p>

    </div>

    <table>

        <tr>
            <th>Iteração</th>
            <th>a</th>
            <th>b</th>
            <th>c</th>
            <th>f(c)</th>
        </tr>

        {% for item in iteracoes %}
        <tr>
            <td>{{ item["iteracao"] }}</td>
            <td>{{ item["a"] }}</td>
            <td>{{ item["b"] }}</td>
            <td>{{ item["c"] }}</td>
            <td>{{ item["f(c)"] }}</td>
        </tr>
        {% endfor %}

    </table>

    {% endif %}

</div>

</body>
</html>
