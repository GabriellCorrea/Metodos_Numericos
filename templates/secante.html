<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Secante</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="ariel-page">

<div class="pagina">

    <a href="/" class="voltar">⬅ Voltar</a>

    <h1>Método da Secante</h1>

    <form method="POST">

        <input
            type="text"
            name="funcao"
            placeholder="Ex: x**3 - x - 2"
            required
        >

        <input
            type="number"
            step="any"
            name="x0"
            placeholder="x0"
            required
        >

        <input
            type="number"
            step="any"
            name="x1"
            placeholder="x1"
            required
        >

        <button type="submit">
            ✨ Calcular
        </button>

    </form>

    {% if resultado %}

    <div class="resultado">

        <h2>Raiz Encontrada</h2>

        <p>{{ resultado }}</p>

    </div>

    <table>

        <tr>
            <th>Iteração</th>
            <th>x0</th>
            <th>x1</th>
            <th>x2</th>
        </tr>

        {% for item in iteracoes %}
        <tr>
            <td>{{ item["iteracao"] }}</td>
            <td>{{ item["x0"] }}</td>
            <td>{{ item["x1"] }}</td>
            <td>{{ item["x2"] }}</td>
        </tr>
        {% endfor %}

    </table>

    {% endif %}

</div>

</body>
</html>
